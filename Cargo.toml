[workspace]
resolver = "3"
members = ["crates/*", "examples/rust-console"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bikebridge-core = { path = "crates/bikebridge-core" }
bikebridge-ble = { path = "crates/bikebridge-ble" }
bikebridge-mock = { path = "crates/bikebridge-mock" }
bikebridge-server = { path = "crates/bikebridge-server" }
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
btleplug = "0.13.1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
