name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Linux Bluetooth build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Hardware-independent tests
        run: cargo test --workspace --locked
      - name: Native release build
        run: cargo build --workspace --release --locked
      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: BikeBridge-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/bikebridge
            target/release/bikebridge.exe
            bikebridge.example.toml
            README.md
            LICENSE
            docs/
